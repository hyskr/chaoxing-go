name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary
        shell: bash
        run: |
          extension=''
          if [ "$GOOS" = windows ]; then
            extension='.exe'
          fi
          mkdir -p dist
          go build -trimpath -o "dist/chaoxing-${GOOS}-${GOARCH}${extension}" ./cmd/chaoxing
          cp LICENSE NOTICE dist/
      - uses: actions/upload-artifact@v7
        with:
          name: chaoxing-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
